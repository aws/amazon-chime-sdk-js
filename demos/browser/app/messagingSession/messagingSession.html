<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  <title>Amazon Chime SDK Channel Message</title>
</head>

<body>
<script type="module" src="./messagingSession.ts"></script>
<div id="demo">
  <div id="sdk-version" class="version-tag"></div>
  <div id="flow-connect" class="flow">
    <div class="flow-centered">
      <div class="card join-card">
        <h1 class="card-title">Messaging Session</h1>
        <form class="stack">
          <label class="field">
            <span class="field-label">UserArn</span>
            <input type="text" id="userArn" name="userArn" class="input" placeholder="userArn" required>
          </label>
          <label class="field">
            <span class="field-label">SessionId (optional)</span>
            <input type="text" id="sessionId" name="sessionId" class="input" placeholder="SessionId">
          </label>
          <fieldset class="radio-group stack">
            <label class="radio">
              <input type="radio" id="prefetchOff" name="prefetchSettings" value="off" checked>prefetch off
            </label>
            <label class="radio">
              <input type="radio" id="prefetchSortByUnread" name="prefetchSettings" value="unread">prefetch sorted by unread
            </label>
            <label class="radio">
              <input type="radio" id="prefetchSortByLastMessageTimestamp" name="prefetchSettings" value="last-message-timestamp">prefetch sorted by last message timestamp
            </label>
          </fieldset>
          <button id="connect" type="button" class="button button-primary button-large">
            Connect
          </button>
        </form>
      </div>
    </div>
  </div>
  <div id="flow-message" class="flow">
    <div class="flow-centered">
      <form class="stack">
        <div id="messages" class="messages-log"></div>
        <div class="button-row" role="toolbar">
          <button id="clear" type="button" class="button button-small">
            Clear
          </button>
          <button id="disconnect" type="button" class="button button-small">
            Disconnect
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
